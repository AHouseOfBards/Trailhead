# tests/gate.conf: Trailhead's settings for tests/gate.sh (sourced by sh).
#
# Trailhead is being rebuilt as a Jellyfin 12.x plugin. These paths are where the plugin will live; until the
# skeleton exists the gate's build step fails, which is correct: there is nothing green to report yet.

# The plugin project that ships.
PROJECT=Jellyfin.Plugin.Trailhead/Jellyfin.Plugin.Trailhead.csproj

# Test projects, space-separated. Each one is run with `dotnet test`.
TEST_PROJECTS="Jellyfin.Plugin.Trailhead.Tests"

