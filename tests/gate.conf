# tests/gate.conf: Trailhead's settings for tests/gate.sh (sourced by sh).

# The plugin project that ships.
PROJECT=Jellyfin.Plugin.Trailhead/Jellyfin.Plugin.Trailhead.csproj

# Test projects, space-separated. Each one is run with `dotnet test`.
TEST_PROJECTS="Jellyfin.Plugin.Trailhead.Tests"

# Releases tools/binchk.sh resolves the shipped DLL against: the lowest 12.x (T3), then the newest stable on NuGet.
BINCHK_VERSIONS="12.0.0 latest"

# A manifest step comes with the first release that has a catalog entry.

# Pebble tests (Jellyfin.Plugin.Trailhead.PebbleTests) need Pebble and a challenge server, which tests/pebble.sh
# installs, starts and stops. Not in TEST_PROJECTS: a bare `dotnet test` of that project has no CA and fails.
# gate.sh runs this after its own steps, so it counts its own pass or fail here.
gate_extra() {
    steps=$((steps + 1))
    echo "=== pebble: sh tests/pebble.sh"
    if sh tests/pebble.sh; then
        echo "=== PASS pebble"
    else
        echo "=== FAIL pebble"; fail=1; failed="$failed pebble"
    fi
}
